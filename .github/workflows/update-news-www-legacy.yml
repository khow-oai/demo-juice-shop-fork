name: "Update news on owasp.org/www-project-juice-shop (legacy)"

on:
  release:
    types: [ published ]

jobs:
  UpdateNewsOnWebsite:
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      with:
        token: ${{ secrets.BOT_TOKEN }}
        repository: OWASP/www-project-juice-shop
        branch: master
    - name: Update tab_news.md
      env:
        RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PYTHON'
        import os
        from pathlib import Path

        marker = '<!-- next:juice-shop -->'
        published_at = os.environ['RELEASE_PUBLISHED_AT']
        tag_name = os.environ['RELEASE_TAG_NAME']
        new_entry = f"{marker}\n* {published_at}: juice-shop [`{tag_name}`](https://github.com/juice-shop/juice-shop/releases/tag/{tag_name})"

        path = Path('tab_news.md')
        path.write_text(path.read_text().replace(marker, new_entry, 1))
        PYTHON
    - uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 #v5.0.1
      with:
        commit_message: "Add juice-shop ${{ github.event.release.tag_name }} release notes to tab_news.md"
        branch: master
        commit_options: '--signoff'

        # Optional commit user and author settings
        commit_user_name: JuiceShopBot
        commit_user_email: 61591748+JuiceShopBot@users.noreply.github.com
        commit_author: JuiceShopBot <61591748+JuiceShopBot@users.noreply.github.com>
